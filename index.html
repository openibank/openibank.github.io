<script>
/* Theme is chosen on the landing page and stored in localStorage; every page
   honours it, so the setting is site-wide rather than per-page. Runs in <head>,
   before first paint, to avoid a flash of the wrong palette. */
(function(){try{var m=localStorage.getItem("forge.theme")||"system";
if(m!=="system")document.documentElement.setAttribute("data-theme",m);}catch(e){}})();
</script>

<style>
  :root{--bg:#08090c;--panel:#111419;--line:#1f2630;--ink:#e9eef5;--dim:#8a97a8;
    --acc:#5b9dff;--acc2:#a78bfa;--ok:#34d399;--warn:#fbbf24;--err:#f87171;

    :root[data-theme="light"]{--bg:#fbfcfe;--panel:#ffffff;--line:#dfe5ee;--ink:#0d1420;--dim:#55637a;--acc:#1f6feb;--acc2:#7c4dff;--ok:#0f8a5f;--warn:#a86800;--err:#c2410c;color-scheme:light}
    @media (prefers-color-scheme:light){
      :root:not([data-theme="dark"]){--bg:#fbfcfe;--panel:#ffffff;--line:#dfe5ee;--ink:#0d1420;--dim:#55637a;--acc:#1f6feb;--acc2:#7c4dff;--ok:#0f8a5f;--warn:#a86800;--err:#c2410c;color-scheme:light}
    }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
  header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
  .bar{display:flex;align-items:center;gap:14px;height:56px;padding:0 20px;max-width:1400px;margin:0 auto}
  .logo{font-weight:750}.logo span{color:var(--acc)}
  .grow{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;
    border-radius:8px;font-size:13.5px;cursor:pointer;font-weight:600}
  .btn:hover{border-color:var(--acc)}
  .btn.p{background:var(--acc);color:#04121f;border-color:var(--acc)}
  .wrap{display:grid;grid-template-columns:300px 1fr 420px;gap:0;height:calc(100vh - 56px)}
  @media(max-width:1100px){.wrap{grid-template-columns:1fr;height:auto}}

  .paneTop{display:flex;align-items:center;gap:8px;margin-bottom:10px}

  .pane{overflow:auto;padding:16px;border-right:1px solid var(--line)}

  .item{padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
  .item:hover{border-color:var(--acc)}

<script>
const RPC="https://testnet.creditchain.org", HUB="/hub";

/* ------------------------------------------------------------------ i18n
   Written per language, not translated from English. Developer tooling has
   settled vocabulary in each locale — a Chinese developer reads 编译 / 部署 /
   调用, not a literal rendering of "compile" — so the strings below use the
   term each community actually uses. Where a word is already loaned (Studio,
   ABI, Gas), it is kept, because translating it would read as wrong.        */
const I18N = {
  en: {
    tabStudio:"Studio", tabCatalog:"Catalog", tabAbout:"About",
    thSystem:"System", thDark:"Dark", thLight:"Light", connect:"Connect wallet",
    verified:"Verified contracts",
    verifiedNote:"From the catalog. Each one is source-verified against its deployed bytecode.",
    myFiles:"My files", myFilesNote:"Kept in this browser. Nothing is uploaded.",
    newFile:"New contract", source:"Source", compile:"Compile",
    interact:"Interact",
    interactNote:"Reads are free and need no wallet. Writes send a real transaction on CreditChain testnet and need a connected wallet. Test CCC has no monetary value.",
    deploy:"Deploy", deployNote:"Deploys from your wallet to CreditChain testnet.",
    pickOne:"Pick a contract, or start a new one.",
    compiling:"Compiling…", loadingSolc:"Fetching the Solidity compiler (first run only)…",
    compiled:"Compiled", noWallet:"Connect a wallet to deploy.", deploying:"Deploying…",
    deployed:"Deployed at", failed:"Failed",
  },
  zh: {
    tabStudio:"Studio", tabCatalog:"合约目录", tabAbout:"关于",
    thSystem:"跟随系统", thDark:"深色", thLight:"浅色", connect:"连接钱包",
    verified:"已验证合约",
    verifiedNote:"来自合约目录，每一个都已用源码与链上字节码比对验证。",
    myFiles:"我的文件", myFilesNote:"仅保存在本浏览器，不会上传。",
    newFile:"新建合约", source:"源码", compile:"编译",
    interact:"调用",
    interactNote:"读取免费，无需钱包。写入会在 CreditChain 测试网发起真实交易，需要连接钱包。测试网 CCC 不具有任何货币价值。",
    deploy:"部署", deployNote:"使用你的钱包部署到 CreditChain 测试网。",
    pickOne:"请选择一个合约，或新建一个。",
    compiling:"编译中…", loadingSolc:"正在获取 Solidity 编译器（仅首次）…",
    compiled:"编译成功", noWallet:"请先连接钱包再部署。", deploying:"部署中…",
    deployed:"已部署于", failed:"失败",
  },
  es: {
    tabStudio:"Studio", tabCatalog:"Catálogo", tabAbout:"Acerca de",
    thSystem:"Sistema", thDark:"Oscuro", thLight:"Claro", connect:"Conectar billetera",
    verified:"Contratos verificados",
    verifiedNote:"Del catálogo. Cada uno está verificado: su código fuente coincide con el bytecode desplegado.",
    myFiles:"Mis archivos", myFilesNote:"Se guardan en este navegador. No se sube nada.",
    newFile:"Nuevo contrato", source:"Código fuente", compile:"Compilar",
    interact:"Interactuar",
    interactNote:"Las lecturas son gratuitas y no necesitan billetera. Las escrituras envían una transacción real en la testnet de CreditChain y requieren billetera conectada. El CCC de prueba no tiene valor monetario.",
    deploy:"Desplegar", deployNote:"Despliega desde tu billetera a la testnet de CreditChain.",
    pickOne:"Elige un contrato o crea uno nuevo.",
    compiling:"Compilando…", loadingSolc:"Descargando el compilador de Solidity (solo la primera vez)…",
    compiled:"Compilado", noWallet:"Conecta una billetera para desplegar.", deploying:"Desplegando…",
    deployed:"Desplegado en", failed:"Error",
  },
};
let LANG = "en";
const t = k => (I18N[LANG] || I18N.en)[k] ?? I18N.en[k] ?? k;

function pickLocale(stored){
  if(stored && stored !== "auto" && I18N[stored]) return stored;
  for(const l of (navigator.languages || [navigator.language || "en"]).map(x => x.toLowerCase())){
    if(l.startsWith("zh")) return "zh";
    if(l.startsWith("es")) return "es";
    if(l.startsWith("en")) return "en";
  }
  return "en";
}
function applyLocale(code){
  LANG = code; document.documentElement.lang = code;
  for(const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
}
function applyTheme(mode){
  if(mode === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
}

/* ------------------------------------------------------- local files */
const FILES_KEY = "forge.files";
let FILES = {}, CURFILE = null;
function loadFiles(){ try{ FILES = JSON.parse(localStorage.getItem(FILES_KEY) || "{}"); }catch(e){ FILES = {}; } }
function saveFiles(){ try{ localStorage.setItem(FILES_KEY, JSON.stringify(FILES)); }catch(e){} }

const STARTER = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.24;

contract Hello {
    string public greeting = "gm from CreditChain";

    function setGreeting(string calldata g) external {
        greeting = g;
    }
}
`;

function renderFiles(){
  const box = document.getElementById("files");
  const names = Object.keys(FILES);
  box.innerHTML = names.length ? names.map(n => `
    <div class="fileRow${n === CURFILE ? " sel" : ""}" data-f="${esc(n)}">
      <span>${esc(n)}</span><span class="x" data-del="${esc(n)}">×</span>
    </div>`).join("") : `<div class="note">—</div>`;
  box.querySelectorAll("[data-f]").forEach(n => n.onclick = e => {
    if(e.target.dataset.del){ delete FILES[e.target.dataset.del]; saveFiles();
      if(CURFILE === e.target.dataset.del) CURFILE = null; renderFiles(); return; }
    openFile(n.dataset.f);
  });
}
function openFile(name){
  CURFILE = name; CUR = null;
  document.getElementById("srcTitle").textContent = name;
  const ed = document.getElementById("editor"), src = document.getElementById("src");
  ed.style.display = "block"; src.style.display = "none";
  ed.value = FILES[name] || "";
  ed.oninput = () => { FILES[name] = ed.value; saveFiles(); };
  document.getElementById("fns").innerHTML = `<div class="note">${esc(t("pickOne"))}</div>`;
  renderFiles();
}

/* --------------------------------------------------------- compiler
   solc runs in a worker so a multi-second compile cannot freeze the page.
   The binary is fetched on first use only — it is several megabytes, and
   most visitors are here to read a verified contract, not to compile.     */
let solcWorker = null;
function getWorker(version){
  if(solcWorker && solcWorker._v === version) return solcWorker;
  if(solcWorker) solcWorker.terminate();
  const code = `
    let loaded = null;
    onmessage = function(e){
      try{
        if(!loaded){
          importScripts("https://binaries.soliditylang.org/bin/soljson-" + e.data.version + ".js");
          loaded = Module.cwrap("solidity_compile", "string", ["string", "number"]);
        }
        postMessage({ ok: true, out: loaded(e.data.input, 0) });
      }catch(err){ postMessage({ ok: false, error: String(err && err.message || err) }); }
    };`;
  solcWorker = new Worker(URL.createObjectURL(new Blob([code], {type:"text/javascript"})));
  solcWorker._v = version;
  return solcWorker;
}

function compileCurrent(){
  const out = document.getElementById("out");
  if(!CURFILE){ out.innerHTML = `<span class="err">${esc(t("pickOne"))}</span>`; return; }
  const version = document.getElementById("solv").value;
  out.textContent = t("loadingSolc");
  const input = JSON.stringify({
    language: "Solidity",
    sources: { [CURFILE]: { content: FILES[CURFILE] || "" } },
    settings: { optimizer: { enabled: true, runs: 200 },
                outputSelection: { "*": { "*": ["abi", "evm.bytecode.object"] } } },
  });
  const w = getWorker(version);
  out.textContent = t("compiling");
  w.onmessage = e => {
    if(!e.data.ok){ out.innerHTML = `<span class="err">${esc(t("failed"))}: ${esc(e.data.error)}</span>`; return; }
    let res; try{ res = JSON.parse(e.data.out); }
    catch(err){ out.innerHTML = `<span class="err">${esc(t("failed"))}</span>`; return; }
    const errs = (res.errors || []).filter(x => x.severity === "error");
    const warns = (res.errors || []).filter(x => x.severity !== "error");
    if(errs.length){
      out.innerHTML = errs.map(x => `<span class="err">${esc(x.formattedMessage || x.message)}</span>`).join("\n");
      document.getElementById("deployBox").style.display = "none";
      return;
    }
    const found = [];
    for(const file in (res.contracts || {}))
      for(const name in res.contracts[file])
        found.push({ name, abi: res.contracts[file][name].abi,
                     bin: res.contracts[file][name].evm.bytecode.object });
    out.innerHTML = `<span class="ok">${esc(t("compiled"))}: ${found.map(f => esc(f.name)).join(", ")}</span>`
      + (warns.length ? "\n" + warns.map(x => esc(x.formattedMessage || x.message)).join("\n") : "");
    showArtifacts(found);
  };
  w.postMessage({ version, input });
}

function showArtifacts(found){
  const box = document.getElementById("deployBox"), list = document.getElementById("artifacts");
  if(!found.length){ box.style.display = "none"; return; }
  box.style.display = "block";
  list.innerHTML = found.map((f, i) => `
    <div class="fileRow"><span>${esc(f.name)}</span>
      <button class="btn x" data-dep="${i}" style="margin-left:auto">${esc(t("deploy"))}</button></div>`).join("");
  list.querySelectorAll("[data-dep]").forEach(b => b.onclick = () => deploy(found[+b.dataset.dep]));
}

async function deploy(art){
  const out = document.getElementById("out");
  const eth = window.ethereum;
  if(!eth){ out.innerHTML = `<span class="err">${esc(t("noWallet"))}</span>`; return; }
  try{
    const [from] = await eth.request({ method: "eth_requestAccounts" });
    out.textContent = t("deploying");
    const hash = await eth.request({ method: "eth_sendTransaction",
      params: [{ from, data: "0x" + art.bin }] });
    // Poll for the receipt; the contract address only exists once mined.
    for(let i = 0; i < 60; i++){
      const r = await rpc("eth_getTransactionReceipt", [hash]);
      if(r && r.contractAddress){
        out.innerHTML = `<span class="ok">${esc(t("deployed"))} ${esc(r.contractAddress)}</span>`;
        return;
      }
      await new Promise(r2 => setTimeout(r2, 2000));
    }
    out.innerHTML = `<span class="ok">${esc(t("deploying"))} ${esc(hash)}</span>`;
  }catch(e){ out.innerHTML = `<span class="err">${esc(t("failed"))}: ${esc(e.message || String(e))}</span>`; }
}

let CARDS=[], CUR=null;

const el=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function rpc(method,params=[]){
  const r=await fetch(RPC,{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});
  const j=await r.json();
  if(j.error) throw new Error(j.error.message||"rpc error");
  return j.result;
}

/* ---------- minimal ABI codec (static types + string/bytes) ----------
   Deliberately dependency-free: no CDN, no build step, nothing to go stale.
   Covers the types CreditChain's agent-finance contracts actually expose. */
const pad=h=>h.replace(/^0x/,"").padStart(64,"0");
function encAddr(v){ if(!/^0x[0-9a-fA-F]{40}$/.test(v.trim())) throw new Error("bad address"); return pad(v.trim().toLowerCase()); }
function encUint(v){ let n=BigInt(String(v).trim()||"0"); if(n<0n) throw new Error("negative"); return pad(n.toString(16)); }
function encBool(v){ return pad((/^(true|1|yes)$/i.test(String(v).trim()))?"1":"0"); }
function encBytes32(v){ const s=String(v).trim(); if(/^0x[0-9a-fA-F]{1,64}$/.test(s)) return pad(s);
  // treat as utf8 label → keccak not available client-side, so require hex
  throw new Error("bytes32 must be 0x-hex"); }
function encodeArg(type,val){
  if(type==="address") return encAddr(val);
  if(/^uint\d*$/.test(type)||/^int\d*$/.test(type)) return encUint(val);
  if(type==="bool") return encBool(val);
  if(type==="bytes32") return encBytes32(val);
  throw new Error("unsupported input type: "+type);
}
function decodeOutputs(types,hex){
  const d=(hex||"0x").replace(/^0x/,""); const words=d.match(/.{1,64}/g)||[];
  return types.map((t,i)=>{
    const w=words[i]||"".padStart(64,"0");
    if(t==="address") return "0x"+w.slice(24);
    if(t==="bool") return BigInt("0x"+w)!==0n;
    if(/^u?int\d*$/.test(t)) return BigInt("0x"+w).toString();
    return "0x"+w;
  });
}
async function selector(sig){
  // keccak-256 via the chain (web3_sha3) — no crypto library needed, and it is
  // the same hash the EVM itself uses.
  const hex="0x"+[...new TextEncoder().encode(sig)].map(b=>b.toString(16).padStart(2,"0")).join("");
  return (await rpc("web3_sha3",[hex])).slice(0,10);
}

/* ---------- catalog ---------- */
async function boot(){
  try{ const c=await rpc("eth_chainId"); el("net").textContent="chainId "+parseInt(c,16); }
  catch{ el("net").textContent="chain unreachable"; }
  const idx=await (await fetch(HUB+"/api/index.json")).json();
  CARDS=await Promise.all(idx.contracts.map(c=>fetch(HUB+"/api/contracts/"+c.slug+".json").then(r=>r.json())));
  el("list").innerHTML=CARDS.map((c,i)=>`
    <div class="item" data-i="${i}">
      <div class="iname">${esc(c.name)}</div>
      <div class="imeta">${esc(c.deployments[0].address.slice(0,14))}… · ${c.interface.abi_entries} ABI</div>
    </div>`).join("");
  [...document.querySelectorAll(".item")].forEach(n=>n.onclick=()=>select(+n.dataset.i));
  const want=location.hash.replace("#","");
  select(Math.max(0, CARDS.findIndex(c=>c.slug===want)));
}

function select(i){
  CUR=CARDS[i]; if(!CUR) return;
  CURFILE=null; renderFiles();
  el("editor").style.display="none"; el("src").style.display="block";
  el("deployBox").style.display="none"; el("out").textContent="";
  location.hash=CUR.slug;
  [...document.querySelectorAll(".item")].forEach((n,j)=>n.classList.toggle("sel",j===i));
  el("srcTitle").textContent="Source · "+CUR.name;
  el("src").textContent=CUR.source_code||"(source unavailable)";
  renderFns();
}

function renderFns(){
  const abi=(CUR.abi||[]).filter(e=>e.type==="function");
  el("fns").innerHTML = abi.map((f,i)=>{
    const read=/^(view|pure)$/.test(f.stateMutability||"");
    return `<div class="fn" data-i="${i}">
      <div class="fnhead"><span class="fnname">${esc(f.name)}</span>
        <span class="tag ${read?'t-read':'t-write'}">${read?'read':'write'}</span></div>
      <div class="fnbody">
        ${(f.inputs||[]).map((inp,k)=>`<input data-k="${k}" placeholder="${esc(inp.name||('arg'+k))}: ${esc(inp.type)}">`).join("")}
        <button class="btn ${read?'':'p'}" data-run="${i}">${read?'Call':'Send transaction'}</button>
        <div class="out" style="display:none"></div>
      </div></div>`;
  }).join("") || '<div class="note">No callable functions.</div>';

  [...document.querySelectorAll(".fnhead")].forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
  [...document.querySelectorAll("[data-run]")].forEach(b=>b.onclick=()=>run(+b.dataset.run,b));
}

async function run(i,btn){
  const f=(CUR.abi||[]).filter(e=>e.type==="function")[i];
  const box=btn.parentElement, out=box.querySelector(".out");
  const vals=[...box.querySelectorAll("input")].map(x=>x.value);
  const read=/^(view|pure)$/.test(f.stateMutability||"");
  out.style.display="block"; out.className="out"; out.textContent="…";
  try{
    const types=(f.inputs||[]).map(x=>x.type);
    const sig=f.name+"("+types.join(",")+")";
    const data=(await selector(sig))+types.map((t,k)=>encodeArg(t,vals[k])).join("");
    const to=CUR.deployments[0].address;
    if(read){
      const res=await rpc("eth_call",[{to,data},"latest"]);
      const outs=(f.outputs||[]).map(o=>o.type);
      out.className="out ok";
      out.textContent = outs.length? JSON.stringify(decodeOutputs(outs,res)) : (res||"0x");
    }else{
      const s=ForgeAuth.session();
      if(!s){ throw new Error("Connect a wallet first — writes send a real transaction."); }
      await ForgeAuth.ensureChain();
      const tx=await window.ethereum.request({method:"eth_sendTransaction",
        params:[{from:s.address,to,data}]});
      out.className="out ok"; out.textContent="tx "+tx;
    }
  }catch(e){ out.className="out err"; out.textContent=(e&&e.message)||String(e); }
}

/* ---------- agent API: the same actions, scriptable ----------
   An agent drives Studio through this object instead of clicking. Same codec,
   same RPC, same contracts — so what a human does here, an agent can automate. */
window.ForgeStudio = {
  contracts: ()=>CARDS.map(c=>({slug:c.slug,name:c.name,address:c.deployments[0].address})),
  card: slug=>CARDS.find(c=>c.slug===slug),
  select: slug=>select(CARDS.findIndex(c=>c.slug===slug)),
  /** Read-only call. No wallet, no gas, no signature. */
  async call(slug,fnName,args=[]){
    const c=CARDS.find(x=>x.slug===slug); if(!c) throw new Error("unknown contract");
    const f=(c.abi||[]).find(e=>e.type==="function"&&e.name===fnName);
    if(!f) throw new Error("unknown function");
    const types=(f.inputs||[]).map(x=>x.type);
    const data=(await selector(fnName+"("+types.join(",")+")"))+types.map((t,k)=>encodeArg(t,args[k])).join("");
    const res=await rpc("eth_call",[{to:c.deployments[0].address,data},"latest"]);
    return decodeOutputs((f.outputs||[]).map(o=>o.type),res);
  },
  rpc,
};

/* ---------- wallet button ---------- */
(function(){
  const btn=el("siwe");
  const paint=()=>{const s=ForgeAuth.session(); btn.textContent=s?ForgeAuth.short(s.address):"Connect wallet";};
  btn.onclick=async()=>{
    if(ForgeAuth.session()){ ForgeAuth.signOut(); paint(); return; }
    if(!ForgeAuth.hasWallet()){ btn.textContent="No wallet found"; setTimeout(paint,2200); return; }
    try{ await ForgeAuth.signIn(); }catch(e){ btn.textContent="Cancelled"; setTimeout(paint,2200); return; }
    paint();
  };
  paint();
})();

/* ------------------------------------------------------------- wiring */
(function init(){
  let storedTheme = "system", storedLang = "auto";
  try{ storedTheme = localStorage.getItem("forge.theme") || "system";
       storedLang  = localStorage.getItem("forge.lang")  || "auto"; }catch(e){}
  applyTheme(storedTheme);
  applyLocale(pickLocale(storedLang));

  const th = el("theme"), lg = el("lang");
  th.value = storedTheme;
  th.onchange = e => { applyTheme(e.target.value);
    try{ localStorage.setItem("forge.theme", e.target.value); }catch(err){} };
  lg.value = storedLang;
  lg.onchange = e => { applyLocale(pickLocale(e.target.value));
    try{ localStorage.setItem("forge.lang", e.target.value); }catch(err){}
    // Panels built imperatively hold text that data-i18n cannot reach, so
    // whichever view is open has to be rebuilt in the new locale.
    if(CUR) select(CARDS.indexOf(CUR));
    else if(CURFILE) openFile(CURFILE);
    else el("fns").innerHTML = `<div class="note">${esc(t("pickOne"))}</div>`; };

  loadFiles();
  if(!Object.keys(FILES).length) FILES["Hello.sol"] = STARTER;
  saveFiles(); renderFiles();

  el("newFile").onclick = () => {
    let n = "Contract.sol", i = 2;
    while(FILES[n]) n = `Contract${i++}.sol`;
    FILES[n] = STARTER.replace("contract Hello", "contract " + n.replace(".sol", ""));
    saveFiles(); openFile(n);
  };
  el("compile").onclick = compileCurrent;
})();

boot().catch(e=>{ el("list").innerHTML='<div class="note">Catalog unavailable: '+esc(e.message)+'</div>'; });
</script>
